<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roofing Quote Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css?v=4" />
</head>
<body>
  <div class="shell">
    <aside class="side" id="side">
      <a class="brand" href="#/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 17 16 5l13 12" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 15v11h16V15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" opacity=".55"/><path d="m12.5 20.5 2.6 2.6 5-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="brand-name" id="brandName">Quote Bot</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="dashboard"><svg viewBox="0 0 20 20"><path d="M3 9.5 10 3l7 6.5V17h-4.5v-4.5h-5V17H3z"/></svg>Dashboard</a>
        <a href="#/new" data-nav="new"><svg viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5H5z M12 2.5V6h3.5 M10 9v6 M7 12h6"/></svg>New Quote</a>
        <a href="#/quotes" data-nav="quotes"><svg viewBox="0 0 20 20"><path d="M4 3.5h12v13H4z M7 7.5h6 M7 10.5h6 M7 13.5h3.5"/></svg>Quotes</a>
        <a href="#/assistant" data-nav="assistant"><svg viewBox="0 0 20 20"><path d="M3.5 4.5h13v9h-7l-4 3v-3h-2z M7 9h.01 M10 9h.01 M13 9h.01"/></svg>AI Assistant</a>
        <div class="nav-label">Setup</div>
        <a href="#/pricing" data-nav="pricing"><svg viewBox="0 0 20 20"><path d="M10 2.5v15 M13.5 5.5H8.3a2.3 2.3 0 0 0 0 4.6h3.4a2.3 2.3 0 0 1 0 4.6H6"/></svg>Pricing &amp; Profile</a>
        <a href="#/documents" data-nav="documents"><svg viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5H5z M12 2.5V6h3.5 M7.5 10h5 M7.5 13h5"/></svg>Documents</a>
      </nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <div class="side-scrim" id="sideScrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Open menu"><svg viewBox="0 0 20 20"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg></button>
        <span class="topbar-title">Quote Bot</span>
        <a class="btn btn-primary btn-sm" href="#/new">New quote</a>
      </header>
      <div class="view" id="view"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/static/js/core.js?v=4"></script>
  <script src="/static/js/art.js?v=4"></script>
  <script src="/static/js/dashboard.js?v=4"></script>
  <script src="/static/js/wizard.js?v=4"></script>
  <script src="/static/js/quote.js?v=4"></script>
  <script src="/static/js/quotes.js?v=4"></script>
  <script src="/static/js/assistant.js?v=4"></script>
  <script src="/static/js/profile.js?v=4"></script>
  <script src="/static/js/documents.js?v=4"></script>
  <script>App.start();</script>
</body>
</html>
